// Sound on iPhone: iOS only lets a page start its audio inside a tap, and mutes pages in silent mode.
// So the audio is woken on every tap, and asks to play through the silent switch like a game.
(function () {
	var made = [];
	var Base = window.AudioContext || window.webkitAudioContext;
	if (Base) {
		var Wrapped = function (options) {
			var context = new Base(options);
			made.push(context);
			return context;
		};
		Wrapped.prototype = Base.prototype;
		window.AudioContext = Wrapped;
		window.webkitAudioContext = Wrapped;
	}
	function wake() {
		for (var i = 0; i < made.length; i++) {
			var c = made[i];
			if (c.state !== 'running') {
				c.resume();
			}
			if (!c.woken) {
				try {
					var s = c.createBufferSource();
					s.buffer = c.createBuffer(1, 1, c.sampleRate);
					s.connect(c.destination);
					s.start(0);
					c.woken = true;
				} catch (e) {}
			}
		}
	}
	['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'keydown'].forEach(function (type) {
		window.addEventListener(type, wake, { capture: true, passive: true });
	});
	document.addEventListener('visibilitychange', function () {
		if (!document.hidden) {
			wake();
		}
	});
	try {
		if (navigator.audioSession) {
			navigator.audioSession.type = 'playback';
		}
	} catch (e) {}
	window.gameAudio = made;
	// Everything bound for the speaker goes through a limiter first, so many sounds at once never clip.
	var connect = AudioNode.prototype.connect;
	AudioNode.prototype.connect = function (dest) {
		if (typeof AudioDestinationNode !== 'undefined' && dest instanceof AudioDestinationNode && !this.isLimiter) {
			var ctx = dest.context;
			if (!ctx.limiter) {
				ctx.limiter = ctx.createDynamicsCompressor();
				ctx.limiter.threshold.value = -6;
				ctx.limiter.knee.value = 4;
				ctx.limiter.ratio.value = 12;
				ctx.limiter.attack.value = 0.003;
				ctx.limiter.release.value = 0.15;
				ctx.limiter.isLimiter = true;
				connect.call(ctx.limiter, dest);
			}
			arguments[0] = ctx.limiter;
		}
		return connect.apply(this, arguments);
	};
})();

		var joined = new ReadableStream({
			pull: function (controller) {

// Offline: once the helper is in charge, every file the game loads is kept on the phone.
var gameReady = (function () {
	if (!('serviceWorker' in navigator)) {
		return Promise.resolve();

	return Promise.race([

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":45974672,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startWhenReady(engine, {
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
